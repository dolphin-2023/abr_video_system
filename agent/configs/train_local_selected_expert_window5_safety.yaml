# Local trace training from scratch.
# Build a 5-chunk sliding-window best-of-BOLA/MPC/BBA expert pool, train SFT,
# then initialize offline RL from that run's SFT checkpoint with low-buffer
# safety loss.

run:
  name: train_local_selected_expert_window5_safety
  root: runs
  log_to_file: true
  log_name: train.log

env:
  # Leave blank to use ABR_LLM_PATH or the repository-local model default.
  llm_path:
  chunk_size_path: assets/example_chunk_sizes.json
  env_verbose: false

runtime:
  torch_num_threads:
  torch_num_interop_threads:
  gradient_checkpointing: true

common:
  qoe_profile: pensieve
  trace_split: train
  trace_dir:
  # Keep the NetLLM training and inference context at the original setting.
  window: 20
  context_len: 20
  sample_step: 5
  # Local trace RTG settings.
  return_scale: 100.0
  reward_normalization: percentile
  reward_percentile_low: 1.0
  reward_percentile_high: 99.0
  clip_normalized_reward: true
  target_return_scale: 1.0

validation:
  episodes: 30
  split: train
  trace_dir:
  sample_mode: stratified
  seed: 20260507

data:
  reuse_existing: false
  collection_mode: selected
  combined_name: expert_selected_window5_local.npz
  progress_interval: 10
  selected:
    save_name: expert_selected_window5_local.npz
    trace_split: train
    # Match the original local collection scale: 160 + 120 episodes.
    max_traces: 280
    sample_mode: stratified
    expert_policies: [bola, mpc, bba]
    bba_reservoir: 5.0
    bba_cushion: 15.0
    mpc_safety_factor: 0.9
    selection_unit: window
    # Expert QoE comparison horizon; independent of the per-state PAST_K=6.
    selection_window: 5
    selection_stride: 1
    # Keep difficult and negative-return windows for weak-network recovery.
    negative_return_weight: 1.0
    positive_return_weight: 1.0
    progress_interval: 10
    seed: 20260507

sft:
  save_name: sft
  model_path: models/netllm_sft_local_selected_expert_window5_safety
  stats_name: training_stats_local_selected_expert_window5_safety.json
  stats_path: models/training_stats_local_selected_expert_window5_safety.json
  epochs: 12
  min_epochs: 2
  early_stop_patience: 3
  class_weight_power: 0.2
  max_class_weight: 3.0
  validation_episodes: 30
  progress_interval: 100
  validation_progress_interval: 0

offline_rl:
  enabled: true
  init_from_sft: true
  save_name: offline_rl
  model_path: models/netllm_offline_rl_local_selected_expert_window5_safety
  stats_name: training_stats_local_selected_expert_window5_safety.json
  epochs: 8
  min_epochs: 2
  early_stop_patience: 3
  batch_size: 1
  accumulation_steps: 8
  lr: 5.0e-5
  weight_decay: 1.0e-4
  warmup_steps: 200
  grad_clip: 0.25
  train_scope: non_plm_lora
  class_weight_power: 0.1
  max_class_weight: 2.5
  high_return_weight: 0.35
  # safe_action_max=1 produces squared overshoot penalties:
  # a0=0, a1=0, a2=1, a3=4, a4=9, a5=16.
  safety_penalty_weight: 0.5
  safety_buffer_threshold: 4.0
  safety_safe_action_max: 1
  target_return_scale: 1.0
  validation_episodes: 30
  validation_batch_size: 8
  progress_interval: 100
  validation_progress_interval: 0

# This recipe intentionally stops after offline RL and evaluation.
rl:
  enabled: false

pensieve:
  enabled: false

eval:
  enabled: true
  smoke:
    enabled: false
    output_name: evaluation_smoke20.json
    trace_split: test
    episodes: 20
    sample_mode: stratified
    policies: [bola, mpc, random, netllm-sft, netllm-offline-rl]
    progress_interval: 10
  final:
    enabled: true
    output_name: evaluation_test100.json
    trace_split: test
    episodes: 100
    sample_mode: stratified
    policies: [bola, mpc, random, netllm-sft, netllm-offline-rl]
    progress_interval: 10
  external_puffer_recent:
    enabled: true
    output_name: evaluation_external_puffer_recent.json
    trace_split: external_puffer_recent
    trace_dir:
    episodes: 20
    sample_mode: stratified
    policies: [bola, mpc, random, netllm-sft, netllm-offline-rl]
    progress_interval: 5
  external_weak_mobile:
    enabled: true
    output_name: evaluation_external_weak_mobile.json
    trace_split: external_weak_mobile
    trace_dir:
    episodes: 20
    sample_mode: stratified
    policies: [bola, mpc, random, netllm-sft, netllm-offline-rl]
    progress_interval: 5
