<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>ABR 视频流媒体传输监测控制台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <script src="https://cdn.dashjs.org/v4.7.4/dash.all.min.js"></script>
    <style>
        video { width: 100%; aspect-ratio: 16/9; background: #050505; border-radius: 0.5rem; border: 1px solid #333; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 3px; }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen p-6 font-sans">

    <div class="max-w-7xl mx-auto space-y-6">
        <div class="bg-gray-800 p-5 rounded-xl shadow-2xl flex items-center space-x-4 border border-gray-700">
            <div class="flex-1">
                <label class="block text-sm text-gray-400 mb-1 font-mono">视频资源 ID</label>
                <input id="videoIdInput" type="text" class="w-full bg-gray-900 border border-gray-600 rounded px-4 py-2 text-white focus:outline-none focus:border-blue-500 transition" placeholder="输入合规的 DASH 资源标识符">
            </div>
            <button id="startBtn" class="mt-6 bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 px-8 rounded shadow-lg transition">
                初始化系统连接
            </button>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <div class="lg:col-span-2 space-y-4">
                <div class="bg-gray-800 p-4 rounded-xl shadow-2xl relative border border-gray-700">
                    <div class="absolute top-6 left-6 z-10 bg-black/80 px-3 py-1.5 rounded text-sm text-gray-300 font-mono border border-gray-700 shadow" id="traceBadge">
                        网络环境: 待接入
                    </div>
                    <div class="absolute top-6 right-6 z-10 bg-black/80 px-3 py-1.5 rounded text-sm text-green-400 font-mono border border-green-900 shadow" id="qualityBadge">
                        传输状态: 待初始化
                    </div>
                    <video id="videoPlayer" controls autoplay muted></video>
                </div>
            </div>

            <div class="space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div class="bg-gray-800 p-4 rounded-xl shadow-lg border border-gray-700">
                        <div class="text-xs text-gray-400 font-mono">前向可用缓冲 (s)</div>
                        <div class="text-3xl font-bold text-blue-400 mt-1" id="bufferValue">0.00</div>
                    </div>
                    <div class="bg-gray-800 p-4 rounded-xl shadow-lg border border-gray-700">
                        <div class="text-xs text-gray-400 font-mono">切片下载速度 (Kbps)</div>
                        <div class="text-3xl font-bold text-emerald-400 mt-1" id="speedValue">0</div>
                    </div>
                    <div class="bg-gray-800 p-4 rounded-xl shadow-lg border border-gray-700 col-span-2">
                        <div class="text-xs text-gray-400 font-mono">累计 QoE 收益</div>
                        <div class="text-3xl font-bold text-purple-400 mt-1" id="qoeValue">0.00</div>
                    </div>
                </div>

                <div class="bg-gray-800 p-4 rounded-xl shadow-lg border border-gray-700">
                    <div id="metricChart" class="w-full h-64"></div>
                </div>

                <div class="bg-gray-900 p-4 rounded-xl shadow-inner h-48 overflow-y-auto font-mono text-sm border border-gray-700 flex flex-col-reverse" id="decisionLog">
                </div>
            </div>
        </div>
    </div>

    <script>
        const SIMULATOR_URL = "http://127.0.0.1:8082";          
        const AGENT_URL = "http://127.0.0.1:8081/abr_decision"; 

        let player;
        let chart;
        
        let chartData = { time: [], buffer: [], actualBw: [], limitBw: [] };
        let timeTick = 0;
        
        let prevBitrateKbps = 0;
        let totalQoE = 0;
        let uiTelemetryInterval;
        
        let globalVideoBytesReceived = 0;
        let lastVideoBytesReceived = 0;
        
        const originalFetch = window.fetch;
        window.fetch = async function(...args) {
            const response = await originalFetch.apply(this, args);
            const url = typeof args[0] === 'string' ? args[0] : (args[0] && args[0].url ? args[0].url : '');
            
            if (url.includes('.m4s') || url.includes('.mpd')) {
                const clone = response.clone();
                (async () => {
                    try {
                        const reader = clone.body.getReader();
                        while (true) {
                            const { done, value } = await reader.read();
                            if (done) break;
                            if (value) {
                                globalVideoBytesReceived += value.length;
                            }
                        }
                    } catch (e) {}
                })();
            }
            return response;
        };

        const origOpen = XMLHttpRequest.prototype.open;
        const origSend = XMLHttpRequest.prototype.send;
        XMLHttpRequest.prototype.open = function() {
            this._reqUrl = arguments[1];
            origOpen.apply(this, arguments);
        };
        XMLHttpRequest.prototype.send = function() {
            this.addEventListener('progress', function(e) {
                if (this._reqUrl && (this._reqUrl.includes('.m4s') || this._reqUrl.includes('.mpd'))) {
                    const currentLoaded = e.loaded;
                    const delta = currentLoaded - (this._lastLoaded || 0);
                    globalVideoBytesReceived += delta;
                    this._lastLoaded = currentLoaded;
                }
            });
            origSend.apply(this, arguments);
        };

        function printLog(msg, type = 'info') {
            const logDiv = document.getElementById('decisionLog');
            const time = new Date().toLocaleTimeString('en-US', { hour12: false, fractionalSecondDigits: 2 });
            let color = 'text-gray-400';
            
            if (type === 'decision') color = 'text-yellow-400';
            if (type === 'error') color = 'text-red-400';
            if (type === 'system') color = 'text-blue-400';
            if (type === 'qoe') color = 'text-purple-400';
            if (type === 'llm') color = 'text-indigo-400';
            
            const entry = document.createElement('div');
            entry.className = `${color} mb-1.5 leading-relaxed`;
            entry.innerText = `[${time}] ${msg}`;
            logDiv.prepend(entry);
        }

        function initChart() {
            chart = echarts.init(document.getElementById('metricChart'), 'dark', { background: 'transparent' });
            chart.setOption({
                tooltip: { trigger: 'axis' },
                legend: { data: ['缓冲(s)', '实际带宽(Mbps)', '物理限速(Mbps)'], bottom: 0, textStyle: { color: '#9ca3af', fontSize: 10 } },
                grid: { top: 30, left: 30, right: 30, bottom: 40 },
                xAxis: { type: 'category', boundaryGap: false, data: [], axisLine: { lineStyle: { color: '#4b5563' } } },
                yAxis: [
                    { type: 'value', position: 'left', splitLine: { show: false } },
                    { type: 'value', position: 'right', splitLine: { show: true, lineStyle: { type: 'dashed', opacity: 0.1 } } }
                ],
                series: [
                    { name: '缓冲(s)', type: 'line', smooth: true, data: [], itemStyle: { color: '#60a5fa' }, areaStyle: { opacity: 0.1 } },
                    { name: '实际带宽(Mbps)', type: 'line', yAxisIndex: 1, smooth: true, data: [], itemStyle: { color: '#10b981' }, areaStyle: { opacity: 0.2 } },
                    { name: '物理限速(Mbps)', type: 'line', step: 'end', yAxisIndex: 1, data: [], itemStyle: { color: '#f87171' }, lineStyle: { type: 'dashed', width: 2 } }
                ]
            });
        }

        function pushTelemetryData(buffer, actualKbps, limitKbps) {
            timeTick++;
            chartData.time.push(timeTick);
            chartData.buffer.push(buffer.toFixed(2));
            chartData.actualBw.push((actualKbps / 1000).toFixed(2));
            chartData.limitBw.push((limitKbps / 1000).toFixed(2));

            if (chartData.time.length > 60) {
                chartData.time.shift(); 
                chartData.buffer.shift(); 
                chartData.actualBw.shift(); 
                chartData.limitBw.shift();
            }

            chart.setOption({
                xAxis: { data: chartData.time },
                series: [{ data: chartData.buffer }, { data: chartData.actualBw }, { data: chartData.limitBw }]
            });
        }

        async function fetchEnvironmentStatus() {
            try {
                const res = await fetch(`${SIMULATOR_URL}/api/sim/status`);
                const data = await res.json();
                document.getElementById('traceBadge').innerText = `网络环境: ${data.trace_name}`;
                return data.current_kbps;
            } catch (e) {
                return 0;
            }
        }

        function getExactBufferLevel() {
            const v = document.getElementById('videoPlayer');
            if (!v || !v.buffered || v.buffered.length === 0) return 0.0;
            
            let bufferLevel = 0.0;
            const currentTime = v.currentTime;
            
            for (let i = 0; i < v.buffered.length; i++) {
                if (currentTime >= v.buffered.start(i) && currentTime <= v.buffered.end(i)) {
                    bufferLevel = v.buffered.end(i) - currentTime;
                    break;
                }
            }
            
            if (bufferLevel === 0 && v.buffered.end(v.buffered.length - 1) > currentTime) {
                bufferLevel = v.buffered.end(v.buffered.length - 1) - currentTime;
            }
            
            return Math.max(0, bufferLevel);
        }

        document.getElementById('startBtn').addEventListener('click', async () => {
            const videoId = document.getElementById('videoIdInput').value.trim();
            if (!videoId) return printLog("异常：视频资源 ID 不能为空", 'error');

            const mpdUrl = `${SIMULATOR_URL}/video/${videoId}/${videoId}.mpd`;
            const videoElement = document.getElementById('videoPlayer');
            try {
                await fetch("http://127.0.0.1:8081/reset_session", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ video_id: videoId })
                });
            } catch (e) {
                printLog("Agent 会话重置失败，继续沿用新建播放器流程", "error");
            }

            if (player) {
                player.destroy();
                clearInterval(uiTelemetryInterval);
                chartData = { time: [], buffer: [], actualBw: [], limitBw: [] };
                timeTick = 0;
                totalQoE = 0;
                prevBitrateKbps = 0;
                
                globalVideoBytesReceived = 0;
                lastVideoBytesReceived = 0;
                document.getElementById('qoeValue').innerText = "0.00";
                document.getElementById('speedValue').innerText = "0";
            }

            player = dashjs.MediaPlayer().create();
            player.initialize(videoElement, mpdUrl, true);
            
            player.updateSettings({
                streaming: { abr: { autoSwitchBitrate: { video: false } } }
            });
            
            printLog("播放器初始化完成，内置 ABR 已关闭，使用 Agent 决策", 'system');

            uiTelemetryInterval = setInterval(async () => {
                if (!player) return;
                
                const bufferLevel = getExactBufferLevel();
                const limitKbps = await fetchEnvironmentStatus();
                
                const bytesDelta = globalVideoBytesReceived - lastVideoBytesReceived;
                lastVideoBytesReceived = globalVideoBytesReceived;
                const actualKbps = (bytesDelta * 8) / 1000; 

                document.getElementById('bufferValue').innerText = bufferLevel.toFixed(2);
                pushTelemetryData(bufferLevel, actualKbps, limitKbps);

                const currentQualityIdx = player.getQualityFor('video');
                const bitratesInfo = player.getBitrateInfoListFor('video'); 
                if (bitratesInfo && bitratesInfo.length > 0) {
                    const currentBitrateKbps = bitratesInfo[currentQualityIdx].bitrate / 1000;
                    document.getElementById('qualityBadge').innerText = `目标档位: [${currentQualityIdx}] ${currentBitrateKbps.toFixed(0)} Kbps`;
                }
            }, 1000); 

            player.on(dashjs.MediaPlayer.events.FRAGMENT_LOADING_COMPLETED, async function (e) {
                if (e.request.mediaType !== 'video' || e.request.type !== 'MediaSegment') return;

                const downloadTimeSec = (e.request.requestEndDate.getTime() - e.request.requestStartDate.getTime()) / 1000;
                const segmentAvgKbps = player.getAverageThroughput('video') || 0.0;
                
                document.getElementById('speedValue').innerText = segmentAvgKbps.toFixed(0);

                const currentBufferForQoe = getExactBufferLevel();
                const currentQualityIdx = player.getQualityFor('video'); 
                const bitratesInfo = player.getBitrateInfoListFor('video'); 
                const availableBitrates = bitratesInfo.map(b => b.bitrate); 

                if (availableBitrates.length === 0) return;

                const currentBitrateKbps = availableBitrates[currentQualityIdx] / 1000;
                const stallTime = Math.max(0, downloadTimeSec - currentBufferForQoe);
                
                const qualityReward = (currentBitrateKbps / 1000.0) * 10.0; 
                const smoothPenalty = prevBitrateKbps === 0 ? 0 : Math.abs(currentBitrateKbps - prevBitrateKbps) / 1000.0;
                
                const segmentQoE = qualityReward - (4.3 * stallTime) - (1.0 * smoothPenalty);
                const trainingSegmentReward = (currentBitrateKbps / 1000.0) - (4.3 * stallTime) - (1.0 * smoothPenalty);
                totalQoE += segmentQoE;
                prevBitrateKbps = currentBitrateKbps;

                document.getElementById('qoeValue').innerText = totalQoE.toFixed(2);
                printLog(`切片核算: 耗时 ${downloadTimeSec.toFixed(2)}s, 段均带宽 ${segmentAvgKbps.toFixed(0)}Kbps`, 'qoe');

                const statePayload = {
                    video_id: videoId,
                    buffer_level: currentBufferForQoe,
                    throughput_kbps: segmentAvgKbps,
                    available_bitrates: availableBitrates,
                    current_quality_index: currentQualityIdx,
                    last_reward: trainingSegmentReward
                };

                try {
                    const response = await fetch(AGENT_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(statePayload)
                    });
                    
                    if (response.ok) {
                        const result = await response.json();
                        const targetIndex = result.quality_index ?? currentQualityIdx;
                        const reasoning = result.llm_reasoning;
                        
                        if (targetIndex !== currentQualityIdx) {
                            player.setQualityFor('video', targetIndex);
                            printLog(`Agent 指令: 切换档位至 [${targetIndex}]`, 'decision');
                        }
                        
                        // 打印大脑的深度思考
                        if (reasoning) {
                            printLog(`LLM 诊断: ${reasoning}`, 'llm');
                        }
                    }
                } catch (error) {
                    printLog("通信失败，维持当前状态", 'error');
                }
            });
        });

        window.addEventListener('load', initChart);
        window.addEventListener('resize', () => chart && chart.resize());
    </script>
</body>
</html>
