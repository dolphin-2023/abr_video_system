<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABR 视频流媒体传输控制台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <script src="https://cdn.dashjs.org/v4.7.4/dash.all.min.js"></script>
    <style>
        :root {
            color-scheme: dark;
            --panel: #121826;
            --panel-2: #0d1320;
            --line: #263246;
            --text-soft: #9aa7bb;
            --accent: #54a3ff;
            --good: #21c48d;
            --warn: #f2b84b;
            --bad: #f06472;
        }
        body {
            margin: 0;
            min-height: 100vh;
            background: #09111f;
            color: #eef3fb;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        video {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #030712;
            border: 1px solid var(--line);
            border-radius: 8px;
        }
        .panel {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 8px;
        }
        .panel-subtle {
            background: var(--panel-2);
            border: 1px solid var(--line);
            border-radius: 8px;
        }
        .label {
            color: var(--text-soft);
            font-size: 12px;
            line-height: 1;
        }
        .mono {
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
        }
        .btn {
            border-radius: 6px;
            border: 1px solid transparent;
            padding: 10px 14px;
            font-size: 14px;
            font-weight: 700;
            transition: background 120ms ease, border-color 120ms ease, color 120ms ease;
        }
        .btn-primary { background: #2563eb; color: white; }
        .btn-primary:hover { background: #1d4ed8; }
        .btn-ghost { background: #111827; border-color: var(--line); color: #dbe6f7; }
        .btn-ghost:hover { background: #182235; }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 999px;
            background: var(--warn);
            box-shadow: 0 0 16px currentColor;
        }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-thumb { background: #35445f; border-radius: 999px; }
    </style>
</head>
<body>
    <main class="max-w-[1500px] mx-auto p-4 lg:p-6 space-y-4">
        <header class="flex flex-col gap-3 lg:flex-row lg:items-center lg:justify-between">
            <div>
                <h1 class="text-2xl font-bold tracking-normal">ABR 视频流媒体传输控制台</h1>
                <p class="text-sm text-slate-400 mt-1">NetLLM Agent · DASH · Trace-driven Network Simulator</p>
            </div>
            <div class="flex flex-wrap gap-2 text-sm">
                <span id="agentStatus" class="panel-subtle px-3 py-2 text-slate-300">Agent: 未连接</span>
                <span id="simStatus" class="panel-subtle px-3 py-2 text-slate-300">Simulator: 未连接</span>
                <span id="processorStatus" class="panel-subtle px-3 py-2 text-slate-300">Processor: 待命</span>
            </div>
        </header>

        <section class="grid grid-cols-1 xl:grid-cols-[360px_1fr_360px] gap-4">
            <aside class="panel p-4 space-y-4">
                <div class="flex items-center justify-between">
                    <div>
                        <div class="label">视频输入</div>
                        <div class="text-lg font-semibold mt-1">上传或加载 DASH</div>
                    </div>
                    <div class="status-dot text-amber-300" id="uploadDot"></div>
                </div>

                <div class="panel-subtle p-3 space-y-3">
                    <input id="fileInput" type="file" accept="video/mp4" class="block w-full text-sm text-slate-300 file:mr-3 file:rounded-md file:border-0 file:bg-blue-600 file:px-3 file:py-2 file:text-sm file:font-semibold file:text-white hover:file:bg-blue-500">
                    <button id="uploadBtn" class="btn btn-primary w-full">上传并转码</button>
                    <div>
                        <div class="flex justify-between label mb-2">
                            <span id="uploadStatus">等待上传</span>
                            <span id="uploadPercent">0%</span>
                        </div>
                        <div class="h-2 bg-slate-800 rounded-full overflow-hidden">
                            <div id="uploadProgress" class="h-full bg-blue-500 transition-all" style="width: 0%"></div>
                        </div>
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="label block" for="videoIdInput">视频 ID</label>
                    <div class="flex gap-2">
                        <input id="videoIdInput" type="text" class="w-full bg-slate-950 border border-slate-700 rounded-md px-3 py-2 text-sm text-white outline-none focus:border-blue-500" placeholder="processor 返回的 video_id">
                        <button id="startBtn" class="btn btn-primary whitespace-nowrap">播放</button>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div class="panel-subtle p-3">
                        <div class="label">当前策略</div>
                        <div id="policyName" class="text-base font-semibold mt-2 text-blue-300">未知</div>
                    </div>
                    <div class="panel-subtle p-3">
                        <div class="label">目标回报</div>
                        <div id="targetReturn" class="text-base font-semibold mt-2 text-emerald-300">--</div>
                    </div>
                    <div class="panel-subtle p-3 col-span-2">
                        <div class="label">Trace</div>
                        <div id="traceName" class="text-sm mono mt-2 text-slate-200 truncate">等待接入</div>
                    </div>
                </div>

                <button id="randomTraceBtn" class="btn btn-ghost w-full">切换网络 trace</button>
            </aside>

            <section class="space-y-4">
                <div class="panel p-3 relative">
                    <div class="absolute top-5 left-5 z-10 flex gap-2 text-xs mono">
                        <span id="qualityBadge" class="bg-black/70 border border-slate-700 rounded-md px-3 py-1.5 text-emerald-300">档位: --</span>
                        <span id="bufferBadge" class="bg-black/70 border border-slate-700 rounded-md px-3 py-1.5 text-blue-300">Buffer: 0.00s</span>
                    </div>
                    <video id="videoPlayer" controls autoplay muted></video>
                </div>

                <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                    <div class="panel p-4">
                        <div class="label">Buffer</div>
                        <div class="text-3xl font-bold mt-2 text-blue-300"><span id="bufferValue">0.00</span><span class="text-sm text-slate-500 ml-1">s</span></div>
                    </div>
                    <div class="panel p-4">
                        <div class="label">Throughput</div>
                        <div class="text-3xl font-bold mt-2 text-emerald-300"><span id="speedValue">0</span><span class="text-sm text-slate-500 ml-1">Kbps</span></div>
                    </div>
                    <div class="panel p-4">
                        <div class="label">QoE</div>
                        <div class="text-3xl font-bold mt-2 text-violet-300"><span id="qoeValue">0.00</span></div>
                    </div>
                    <div class="panel p-4">
                        <div class="label">Switches</div>
                        <div class="text-3xl font-bold mt-2 text-amber-300"><span id="switchValue">0</span></div>
                    </div>
                </div>

                <div class="panel p-4">
                    <div class="flex items-center justify-between mb-2">
                        <div>
                            <div class="label">实时曲线</div>
                            <div class="text-base font-semibold mt-1">Buffer / Throughput / Limit</div>
                        </div>
                        <button id="clearChartBtn" class="btn btn-ghost py-2 px-3">清空</button>
                    </div>
                    <div id="metricChart" class="w-full h-72"></div>
                </div>
            </section>

            <aside class="space-y-4">
                <div class="panel p-4">
                    <div class="label">码率分布</div>
                    <div id="bitrateChart" class="w-full h-56"></div>
                </div>

                <div class="panel p-4">
                    <div class="label">最近决策</div>
                    <div id="decisionLog" class="mt-3 h-[420px] overflow-y-auto space-y-2 text-sm mono"></div>
                </div>
            </aside>
        </section>
    </main>

    <script>
        const PROCESSOR_URL = "http://127.0.0.1:8080";
        const SIMULATOR_URL = "http://127.0.0.1:8082";
        const AGENT_HEALTH_URL = "http://127.0.0.1:8081/health";
        const AGENT_DECISION_URL = "http://127.0.0.1:8081/abr_decision";
        const AGENT_RESET_URL = "http://127.0.0.1:8081/reset_session";

        let player = null;
        let metricChart = null;
        let bitrateChart = null;
        let telemetryTimer = null;
        let jobTimer = null;
        let timeTick = 0;
        let prevBitrateKbps = 0;
        let totalQoE = 0;
        let switchCount = 0;
        let lastQualityIndex = null;
        let globalVideoBytesReceived = 0;
        let lastVideoBytesReceived = 0;
        let chartData = { time: [], buffer: [], actualBw: [], limitBw: [], qoe: [] };
        let bitrateCounts = {};

        const originalFetch = window.fetch;
        window.fetch = async function(...args) {
            const response = await originalFetch.apply(this, args);
            const url = typeof args[0] === "string" ? args[0] : (args[0] && args[0].url ? args[0].url : "");
            if (url.includes(".m4s") || url.includes(".mpd")) {
                const clone = response.clone();
                (async () => {
                    try {
                        const reader = clone.body.getReader();
                        while (true) {
                            const { done, value } = await reader.read();
                            if (done) break;
                            if (value) globalVideoBytesReceived += value.length;
                        }
                    } catch (error) {}
                })();
            }
            return response;
        };

        const origOpen = XMLHttpRequest.prototype.open;
        const origSend = XMLHttpRequest.prototype.send;
        XMLHttpRequest.prototype.open = function() {
            this._reqUrl = arguments[1];
            origOpen.apply(this, arguments);
        };
        XMLHttpRequest.prototype.send = function() {
            this.addEventListener("progress", function(e) {
                if (this._reqUrl && (this._reqUrl.includes(".m4s") || this._reqUrl.includes(".mpd"))) {
                    const delta = e.loaded - (this._lastLoaded || 0);
                    globalVideoBytesReceived += Math.max(0, delta);
                    this._lastLoaded = e.loaded;
                }
            });
            origSend.apply(this, arguments);
        };

        function setText(id, text) {
            document.getElementById(id).innerText = text;
        }

        function printLog(message, type = "info") {
            const log = document.getElementById("decisionLog");
            const entry = document.createElement("div");
            const colors = {
                info: "border-slate-700 text-slate-300",
                system: "border-blue-800 text-blue-300",
                decision: "border-amber-800 text-amber-300",
                qoe: "border-violet-800 text-violet-300",
                error: "border-red-800 text-red-300",
            };
            const time = new Date().toLocaleTimeString("zh-CN", { hour12: false });
            entry.className = `panel-subtle px-3 py-2 ${colors[type] || colors.info}`;
            entry.innerText = `[${time}] ${message}`;
            log.prepend(entry);
        }

        function initCharts() {
            metricChart = echarts.init(document.getElementById("metricChart"), "dark", { background: "transparent" });
            bitrateChart = echarts.init(document.getElementById("bitrateChart"), "dark", { background: "transparent" });
            metricChart.setOption({
                tooltip: { trigger: "axis" },
                legend: { data: ["Buffer(s)", "Throughput(Mbps)", "Limit(Mbps)", "QoE"], bottom: 0, textStyle: { color: "#9aa7bb" } },
                grid: { top: 28, left: 42, right: 42, bottom: 48 },
                xAxis: { type: "category", data: [], axisLine: { lineStyle: { color: "#41516b" } } },
                yAxis: [
                    { type: "value", splitLine: { lineStyle: { color: "#263246" } } },
                    { type: "value", splitLine: { show: false } }
                ],
                series: [
                    { name: "Buffer(s)", type: "line", smooth: true, data: [], color: "#54a3ff" },
                    { name: "Throughput(Mbps)", type: "line", smooth: true, yAxisIndex: 1, data: [], color: "#21c48d" },
                    { name: "Limit(Mbps)", type: "line", step: "end", yAxisIndex: 1, data: [], color: "#f06472" },
                    { name: "QoE", type: "line", smooth: true, data: [], color: "#b78cff" }
                ]
            });
            updateBitrateChart([]);
        }

        function updateMetricChart() {
            metricChart.setOption({
                xAxis: { data: chartData.time },
                series: [
                    { data: chartData.buffer },
                    { data: chartData.actualBw },
                    { data: chartData.limitBw },
                    { data: chartData.qoe }
                ]
            });
        }

        function updateBitrateChart(labels) {
            const data = labels.map(label => bitrateCounts[label] || 0);
            bitrateChart.setOption({
                tooltip: { trigger: "axis" },
                grid: { top: 20, left: 36, right: 16, bottom: 32 },
                xAxis: { type: "category", data: labels, axisLabel: { color: "#9aa7bb" } },
                yAxis: { type: "value", splitLine: { lineStyle: { color: "#263246" } } },
                series: [{ type: "bar", data, color: "#54a3ff", barMaxWidth: 26 }]
            });
        }

        function resetMetrics() {
            timeTick = 0;
            prevBitrateKbps = 0;
            totalQoE = 0;
            switchCount = 0;
            lastQualityIndex = null;
            globalVideoBytesReceived = 0;
            lastVideoBytesReceived = 0;
            bitrateCounts = {};
            chartData = { time: [], buffer: [], actualBw: [], limitBw: [], qoe: [] };
            setText("qoeValue", "0.00");
            setText("switchValue", "0");
            setText("speedValue", "0");
            setText("bufferValue", "0.00");
            updateMetricChart();
            updateBitrateChart([]);
        }

        function getExactBufferLevel() {
            const video = document.getElementById("videoPlayer");
            if (!video || !video.buffered || video.buffered.length === 0) return 0;
            const currentTime = video.currentTime;
            for (let i = 0; i < video.buffered.length; i++) {
                if (currentTime >= video.buffered.start(i) && currentTime <= video.buffered.end(i)) {
                    return Math.max(0, video.buffered.end(i) - currentTime);
                }
            }
            return 0;
        }

        async function refreshHealth() {
            try {
                const res = await fetch(AGENT_HEALTH_URL);
                const data = await res.json();
                setText("agentStatus", `Agent: ${data.active_policy || "unknown"}`);
                setText("policyName", data.active_policy || "unknown");
                setText("targetReturn", Number(data.target_return || 0).toFixed(4));
            } catch (error) {
                setText("agentStatus", "Agent: 未连接");
            }
            try {
                const res = await fetch(`${SIMULATOR_URL}/api/sim/status`);
                const data = await res.json();
                setText("simStatus", `Simulator: ${data.trace_split || "test"}`);
                setText("traceName", data.trace_name || "等待接入");
            } catch (error) {
                setText("simStatus", "Simulator: 未连接");
            }
        }

        async function fetchEnvironmentStatus() {
            try {
                const res = await fetch(`${SIMULATOR_URL}/api/sim/status`);
                const data = await res.json();
                setText("traceName", data.trace_name || "unknown");
                return Number(data.current_kbps || 0);
            } catch (error) {
                return 0;
            }
        }

        function setUploadProgress(progress, statusText) {
            const value = Math.max(0, Math.min(100, Number(progress || 0)));
            document.getElementById("uploadProgress").style.width = `${value}%`;
            setText("uploadPercent", `${Math.round(value)}%`);
            if (statusText) setText("uploadStatus", statusText);
        }

        function pollJob(jobId) {
            clearInterval(jobTimer);
            jobTimer = setInterval(async () => {
                try {
                    const res = await fetch(`${PROCESSOR_URL}/jobs/${jobId}`);
                    const job = await res.json();
                    setUploadProgress(job.progress, job.message || job.status);
                    setText("processorStatus", `Processor: ${job.status}`);
                    if (job.status === "done") {
                        clearInterval(jobTimer);
                        setText("videoIdInput", job.video_id);
                        document.getElementById("videoIdInput").value = job.video_id;
                        document.getElementById("uploadDot").style.background = "var(--good)";
                        printLog(`转码完成: ${job.video_id}`, "system");
                    }
                    if (job.status === "error") {
                        clearInterval(jobTimer);
                        document.getElementById("uploadDot").style.background = "var(--bad)";
                        printLog(job.error || "转码失败", "error");
                    }
                } catch (error) {
                    printLog("查询转码状态失败", "error");
                }
            }, 1000);
        }

        function uploadFile() {
            const file = document.getElementById("fileInput").files[0];
            if (!file) {
                printLog("请选择 MP4 文件", "error");
                return;
            }
            const form = new FormData();
            form.append("file", file);
            const xhr = new XMLHttpRequest();
            xhr.open("POST", `${PROCESSOR_URL}/upload`);
            xhr.upload.onprogress = (event) => {
                if (event.lengthComputable) {
                    setUploadProgress((event.loaded / event.total) * 5, "正在上传");
                }
            };
            xhr.onload = () => {
                if (xhr.status < 200 || xhr.status >= 300) {
                    printLog(`上传失败: HTTP ${xhr.status}`, "error");
                    return;
                }
                const data = JSON.parse(xhr.responseText);
                document.getElementById("videoIdInput").value = data.video_id;
                setUploadProgress(5, "等待转码");
                setText("processorStatus", "Processor: queued");
                printLog(`上传完成，任务 ${data.job_id}`, "system");
                pollJob(data.job_id);
            };
            xhr.onerror = () => printLog("上传请求失败", "error");
            xhr.send(form);
        }

        async function startPlayback() {
            const videoId = document.getElementById("videoIdInput").value.trim();
            if (!videoId) {
                printLog("视频 ID 不能为空", "error");
                return;
            }
            const mpdUrl = `${SIMULATOR_URL}/video/${videoId}/${videoId}.mpd`;
            const videoElement = document.getElementById("videoPlayer");

            try {
                await fetch(AGENT_RESET_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ video_id: videoId })
                });
            } catch (error) {
                printLog("Agent 会话重置失败，继续播放", "error");
            }

            if (player) {
                player.destroy();
                clearInterval(telemetryTimer);
            }
            resetMetrics();

            player = dashjs.MediaPlayer().create();
            player.initialize(videoElement, mpdUrl, true);
            player.updateSettings({
                streaming: { abr: { autoSwitchBitrate: { video: false } } }
            });
            printLog(`播放器已连接: ${videoId}`, "system");

            telemetryTimer = setInterval(async () => {
                if (!player) return;
                const buffer = getExactBufferLevel();
                const limitKbps = await fetchEnvironmentStatus();
                const bytesDelta = globalVideoBytesReceived - lastVideoBytesReceived;
                lastVideoBytesReceived = globalVideoBytesReceived;
                const actualKbps = (bytesDelta * 8) / 1000;

                setText("bufferValue", buffer.toFixed(2));
                setText("bufferBadge", `Buffer: ${buffer.toFixed(2)}s`);
                timeTick += 1;
                chartData.time.push(timeTick);
                chartData.buffer.push(Number(buffer.toFixed(2)));
                chartData.actualBw.push(Number((actualKbps / 1000).toFixed(2)));
                chartData.limitBw.push(Number((limitKbps / 1000).toFixed(2)));
                chartData.qoe.push(Number(totalQoE.toFixed(2)));
                if (chartData.time.length > 80) {
                    for (const key of Object.keys(chartData)) chartData[key].shift();
                }
                updateMetricChart();
            }, 1000);

            player.on(dashjs.MediaPlayer.events.FRAGMENT_LOADING_COMPLETED, async (event) => {
                if (event.request.mediaType !== "video" || event.request.type !== "MediaSegment") return;

                const request = event.request;
                const downloadTimeSec = (request.requestEndDate.getTime() - request.requestStartDate.getTime()) / 1000;
                const segmentAvgKbps = player.getAverageThroughput("video") || 0;
                const bufferForQoe = getExactBufferLevel();
                const currentQualityIdx = player.getQualityFor("video");
                const bitratesInfo = player.getBitrateInfoListFor("video");
                const availableBitrates = bitratesInfo.map(item => item.bitrate);
                if (availableBitrates.length === 0) return;

                const currentBitrateKbps = availableBitrates[currentQualityIdx] / 1000;
                const stallTime = Math.max(0, downloadTimeSec - bufferForQoe);
                const smoothPenalty = prevBitrateKbps === 0 ? 0 : Math.abs(currentBitrateKbps - prevBitrateKbps) / 1000;
                const segmentQoE = (currentBitrateKbps / 1000) * 10 - 4.3 * stallTime - smoothPenalty;
                const trainingReward = (currentBitrateKbps / 1000) - 4.3 * stallTime - smoothPenalty;
                totalQoE += segmentQoE;
                prevBitrateKbps = currentBitrateKbps;

                if (lastQualityIndex !== null && currentQualityIdx !== lastQualityIndex) {
                    switchCount += 1;
                    setText("switchValue", String(switchCount));
                }
                lastQualityIndex = currentQualityIdx;
                bitrateCounts[String(Math.round(currentBitrateKbps))] = (bitrateCounts[String(Math.round(currentBitrateKbps))] || 0) + 1;
                updateBitrateChart(Object.keys(bitrateCounts).sort((a, b) => Number(a) - Number(b)));

                setText("speedValue", segmentAvgKbps.toFixed(0));
                setText("qoeValue", totalQoE.toFixed(2));
                setText("qualityBadge", `档位: ${currentQualityIdx} · ${currentBitrateKbps.toFixed(0)} Kbps`);
                printLog(`片段: q=${currentQualityIdx}, bw=${segmentAvgKbps.toFixed(0)}Kbps, reward=${trainingReward.toFixed(2)}`, "qoe");

                const payload = {
                    video_id: videoId,
                    buffer_level: bufferForQoe,
                    throughput_kbps: segmentAvgKbps,
                    available_bitrates: availableBitrates,
                    current_quality_index: currentQualityIdx,
                    last_reward: trainingReward
                };
                try {
                    const response = await fetch(AGENT_DECISION_URL, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(payload)
                    });
                    if (!response.ok) return;
                    const result = await response.json();
                    const targetIndex = result.quality_index ?? currentQualityIdx;
                    if (targetIndex !== currentQualityIdx) {
                        player.setQualityFor("video", targetIndex);
                        printLog(`Agent: ${currentQualityIdx} -> ${targetIndex}`, "decision");
                    } else {
                        printLog(`Agent: 保持 ${currentQualityIdx}`, "decision");
                    }
                } catch (error) {
                    printLog("Agent 通信失败", "error");
                }
            });
        }

        async function switchTrace() {
            try {
                const res = await fetch(`${SIMULATOR_URL}/api/sim/random_trace`, { method: "POST" });
                const data = await res.json();
                setText("traceName", data.trace || "unknown");
                printLog(`已切换 trace: ${data.trace}`, "system");
            } catch (error) {
                printLog("切换 trace 失败", "error");
            }
        }

        document.getElementById("uploadBtn").addEventListener("click", uploadFile);
        document.getElementById("startBtn").addEventListener("click", startPlayback);
        document.getElementById("randomTraceBtn").addEventListener("click", switchTrace);
        document.getElementById("clearChartBtn").addEventListener("click", () => {
            chartData = { time: [], buffer: [], actualBw: [], limitBw: [], qoe: [] };
            updateMetricChart();
        });

        window.addEventListener("load", () => {
            initCharts();
            refreshHealth();
            setInterval(refreshHealth, 5000);
        });
        window.addEventListener("resize", () => {
            if (metricChart) metricChart.resize();
            if (bitrateChart) bitrateChart.resize();
        });
    </script>
</body>
</html>
